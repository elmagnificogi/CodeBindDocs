name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag v$TAG must match package.json version $PKG"
            exit 1
          fi

      - run: npm run test:unit

      - name: Package VSIX
        run: npm run package

      - name: Publish to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Missing secret VSCE_PAT"
            exit 1
          fi
          VSIX="$(ls -1 *.vsix | head -n1)"
          echo "Publishing $VSIX to Visual Studio Marketplace"
          npx @vscode/vsce publish --no-dependencies --packagePath "$VSIX" -p "$VSCE_PAT"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::Missing secret OVSX_PAT"
            exit 1
          fi
          VSIX="$(ls -1 *.vsix | head -n1)"
          echo "Publishing $VSIX to Open VSX"
          npx ovsx publish --no-dependencies "$VSIX" -p "$OVSX_PAT"

      - name: Prepare release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG_VER" '
            $0 ~ ("^## \\[" ver "\\]") { p=1; print; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CodeBind Docs ${GITHUB_REF_NAME}" > release-notes.md
            echo "" >> release-notes.md
            echo "- VS Marketplace / Open VSX publish" >> release-notes.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "- VS Marketplace: https://marketplace.visualstudio.com/items?itemName=codebinddocs.codebinddocs"
            echo "- Open VSX: https://open-vsx.org/extension/codebinddocs/codebinddocs"
          } >> release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VSIX="$(ls -1 *.vsix | head -n1)"
          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --title "CodeBind Docs ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
